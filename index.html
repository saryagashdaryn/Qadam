function home(){app.innerHTML=`<section class="hero"><div class="wrap"><div class="hero-grid"><div><span class="eyebrow">Алгебра · 9-сынып · Арифметикалық прогрессия</span><h1>Қатені түсін.<br><em>Келесі қадамды</em><br>өзің жаса.</h1><p>Әр есеп — түсінуге бір қадам. Қиындықты анықтап, қажет көмекті ашыңыз. Содан кейін ұқсас есепті өзіңіз орындап көріңіз.</p><button onclick="start('diagnostic')">Оқуды бастау &nbsp; ↗</button><button class="secondary" onclick="show('lab')">Тізбекті зерттеу</button><p class="small">Тіркелу қажет емес. Өз қарқыныңызбен орындаңыз.</p></div><div class="hero-art"><img src="assets/illustration-1.webp" alt="Жоғары көтерілетін баспалдақтар түріндегі оқу қадамының көркем иллюстрациясы"><div class="art-note"><span>ТҮСІНУДЕН ҚОЛДАНУҒА</span><strong><span class="math"><i>a</i><sub><i>n</i></sub></span> = <span class="math"><i>a</i><sub>1</sub></span> + (n − 1)d</strong><small>n-ші мүшеге дейінгі қадам саны — n − 1</small></div></div></div><div class="hero-meta"><div><strong>19</strong><span>оқу тапсырмасы</span></div><div><strong>3</strong><span>жеке жаттығу бағыты</span></div><div><strong>3</strong><span>сатылы көмек</span></div></div></div></section><section class="wrap section"><div class="section-title"><h2>Өзіңізге қажет<br>бағытты табыңыз</h2><p>Жауапты жаттаудан түсінуге қарай: әр кезең сіздің келесі әрекетіңізді айқындайды.</p></div><div class="grid"><article class="card"><span class="num">01</span><h3>Қатені анықтау</h3><p>Айырманың таңбасын, қадам санын және мүшенің нөмірін ажыратыңыз.</p></article><article class="card"><span class="num">02</span><h3>Көмекпен түзету</h3><p>Дайын жауапқа асықпай, үш деңгейлі көмекті ретімен ашыңыз.</p></article><article class="card"><span class="num">03</span><h3>Қайта тексеру</h3><p>Жаңа сандары бар ұқсас есепті көмексіз орындап көріңіз.</p></article></div><div class="home-bottom"><img src="assets/illustration-2.webp" alt="Жеке оқу бағытын бейнелейтін жолдар мен арка иллюстрациясы" loading="lazy"><div><span class="eyebrow">ТҮСІНУДІ ТЕКСЕРУ</span><h3>Білетініңізді жаңа есепте қолданыңыз.</h3><p>Үш қорытынды тапсырма немесе өмірлік жағдаят арқылы шешу жолын түсіндіріңіз.</p><button class="secondary" onclick="start('exit')">Қорытынды тапсырмалар</button></div></div><div class="notice"><b>ЖИ-мен жұмыс қалай жүреді?</b> Жаттығулар ЖИ көмегімен әзірленіп, математикалық тексеруден өтті. Жауапты тексеру алдын ала анықталған ережелерге сүйенеді. Мұғалім анонимді нәтижелерден ЖИ-ге сұрау дайындап, алынған ұсынысты өзі тексереді. Сайтта тірі ЖИ чат қосылмаған.</div></section>`}
function start(phase,skill){document.querySelectorAll('[data-nav]').forEach(e=>e.setAttribute('aria-current',e.dataset.nav==='diagnostic'?'page':'false'));let tasks;if(phase==='diagnostic'){tasks=DATA.diagnostic;saved.records=saved.records.filter(r=>r.phase!=='diagnostic');persist()}else if(phase==='practice')tasks=DATA.practice.filter(t=>t.skill===(skill||recommended()));else if(phase==='exit')tasks=DATA.exit;else tasks=[DATA.transfer];run={phase,tasks,index:0,attempts:0,hints:0,firstCorrect:null,done:false,resolved:false};renderTask()}
function renderTask(){const t=run.tasks[run.index];app.innerHTML=`<div class="wrap"><section class="stage"><div class="stage-head"><div><span class="eyebrow">${({diagnostic:'Бастапқы диагностика',practice:'Жеке жаттығу',exit:'Қайта тексеру',transfer:'Өмірлік есеп'})[run.phase]}</span><h2 style="margin:8px 0">${esc(SKILLS[t.skill]||'Жаңа жағдайда қолдану')}</h2></div><span>${run.index+1} / ${run.tasks.length}</span></div><div class="progress" aria-label="Орындалған тапсырмалар"><span style="width:${run.index/run.tasks.length*100}%"></span></div><article class="card" style="margin-top:24px"><div class="task-context"><span>ҚАДАМ / АРИФМЕТИКАЛЫҚ ПРОГРЕССИЯ</span><strong><span class="math"><i>a</i><sub><i>n</i></sub></span> = <span class="math"><i>a</i><sub>1</sub></span> + (n − 1)d</strong></div><span class="pill">Алдымен өзіңіз шешіп көріңіз</span><div class="task">${mathHTML(t.question)}</div><form id="answerForm"><div class="answer-row"><label>Жауабыңыз<br><input type="text" id="answer" inputmode="decimal" autocomplete="off" aria-describedby="feedback" placeholder="Сан енгізіңіз"></label><button id="checkBtn" type="submit">Тексеру</button><button class="secondary" type="button" onclick="hint()" id="hintBtn">Көмек ашу</button></div></form><div id="feedback" aria-live="polite"></div><div id="hints"></div><div class="actions"><button id="nextBtn" class="hidden" onclick="nextTask()">${run.index+1===run.tasks.length?'Қорытындыны көру':'Келесі тапсырма'}</button><button id="revealBtn" class="link hidden" onclick="reveal()">Шешу жолын қарап үйрену</button></div></article><p class="small">Бұл — үйренуге арналған жұмыс. Қате жауап үшін баға төмендемейді. Көмекті қолдану нәтижеде бөлек белгіленеді.</p><button class="link" onclick="if(confirm('Ағымдағы тапсырмадан шығасыз ба? Жазылған нәтижелер сақталады.'))show('home')">Басты бетке оралу</button></section></div>`;document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer()};document.getElementById('answer').focus()}
function submitAnswer(){if(!run||run.done)return;const t=run.tasks[run.index],r=checkAnswer(t,document.getElementById('answer').value),fb=document.getElementById('feedback');fb.className='feedback '+(r.correct?'good':'error');fb.innerHTML=mathHTML(r.message);if(!r.valid)return;run.attempts++;if(run.firstCorrect===null)run.firstCorrect=r.correct&&run.hints===0;if(r.correct){run.resolved=true;finishItem(false)}else if(run.attempts>=2)document.getElementById('revealBtn').classList.remove('hidden')}
function hint(){if(!run||run.done)return;const t=run.tasks[run.index];if(run.hints>=t.hints.length)return;const el=document.createElement('div');el.className='hint';el.innerHTML=mathHTML(`Көмек ${run.hints+1}. ${t.hints[run.hints]}`);document.getElementById('hints').append(el);run.hints++;if(run.hints>=t.hints.length)document.getElementById('hintBtn').disabled=true}
function reveal(){if(!run||run.done)return;const t=run.tasks[run.index],el=document.getElementById('feedback');el.className='feedback';el.innerHTML=mathHTML('Шешу жолы: '+t.explanation+' Жауап: '+t.answer+'. Ұқсас есепті қайта тексеруде өзіңіз орындаңыз.');if(run.firstCorrect===null)run.firstCorrect=false;finishItem(true)}
function finishItem(revealed){if(run.done)return;run.done=true;const t=run.tasks[run.index];saved.records.push({id:t.id,phase:run.phase,skill:t.skill,firstCorrect:!!run.firstCorrect,resolved:run.resolved,hints:run.hints,attempts:run.attempts,revealed,time:new Date().toISOString()});persist();document.getElementById('answer').disabled=true;document.getElementById('checkBtn').disabled=true;document.getElementById('hintBtn').disabled=true;document.getElementById('nextBtn').classList.remove('hidden');document.getElementById('revealBtn').classList.add('hidden')}
function nextTask(){if(!run||!run.done)return;run.index++;if(run.index>=run.tasks.length){summary();return}Object.assign(run,{attempts:0,hints:0,firstCorrect:null,done:false,resolved:false});renderTask()}
function summary(){const phase=run.phase,ids=run.tasks.map(t=>t.id),recent=saved.records.filter(r=>r.phase===phase&&ids.includes(r.id)).slice(-ids.length);run=null;app.innerHTML=`<div class="wrap"><section class="stage card"><span class="eyebrow">Оқу қорытындысы</span><h1 style="font-size:38px">Келесі қадамыңыз дайын.</h1><p>Осы бөлімдегі нәтижелеріңізді қарап, жаттығуды жалғастырыңыз. Дұрыс жауаптың өзі түсінудің толық дәлелі емес: шешу жолын ауызша түсіндіріп көріңіз.</p><div class="stats"><div><strong>${recent.length}</strong>Орындалған тапсырма</div><div><strong>${recent.filter(r=>r.firstCorrect).length}</strong>Алғашқы әрекетте, көмексіз</div><div><strong>${recent.filter(r=>r.hints>0||r.revealed).length}</strong>Көмекпен үйренген тапсырма</div></div><h3>Жеке жаттығу бағыты</h3><p>${esc(SKILLS[recommended()])}. Ұсыныс бастапқы диагностиканың ережелік талдауына негізделген. Нақты себепті мұғаліммен талқылаңыз.</p><div class="actions"><button onclick="start('practice')">Ұсынылған жаттығу</button><button class="secondary" onclick="start('exit')">Қайта тексеру</button><button class="secondary" onclick="start('transfer')">Өмірлік есеп</button><button class="secondary" onclick="show('teacher')">Нәтижені қарау</button></div></section></div>`;window.scrollTo(0,0)}
function lab(){app.innerHTML=`<section class="wrap section"><div class="section-visual"><div><span class="eyebrow">Тізбек зертханасы</span><h1 style="font-size:44px">Неліктен n − 1?</h1><p>Сандарды өзгертіңіз. Қадам мен мүшенің арасындағы байланысты өзіңіз байқаңыз.</p></div><img src="assets/illustration-2.webp" alt="Өзгерісті бақылауға арналған көркем жол иллюстрациясы"></div><div class="split"><div class="card"><label for="a1">Бірінші мүше: <output id="a1v"></output></label><input type="range" id="a1" min="-10" max="10" value="3" oninput="plot()"><label for="d">Айырма: <output id="dv"></output></label><input type="range" id="d" min="-6" max="6" value="4" oninput="plot()"><label for="n">Реттік нөмір: <output id="nv"></output></label><input type="range" id="n" min="1" max="10" value="4" oninput="plot()"><div id="labFormula" class="notice"></div><p>Алдымен d-ні теріс санға ауыстырыңыз. Тізбек қалай өзгереді? Содан кейін n = 1 қойып, қадам санын түсіндіріңіз.</p></div><div class="card"><svg class="plot" id="plot" role="img" aria-label="Алғашқы он мүшенің графигі" viewBox="0 0 480 240"></svg><p id="sequenceText" class="mono"></p><p class="small">Көлденең ось — n, тік ось — <span class="math"><i>a</i><sub><i>n</i></sub></span>. Нүктелер тізбектің дискретті мүшелерін көрсетеді.</p></div></div><div class="card" style="margin-top:24px"><h3>ЖИ жауабын тексеру</h3><p>Үлгі қате пайым: «<span class="math"><i>a</i><sub>1</sub></span> = 3, d = 4 болса, <span class="math"><i>a</i><sub>4</sub></span> = 3 + 4 × 4 = 19».</p><p><b>Тапсырма:</b> қатені түсіндіріп, дұрыс мәнді табыңыз. Жоғарыдағы модельмен дәлелдеңіз.</p><details><summary>Тексеру үлгісін ашу</summary><p>Бірінші мүшеден төртінші мүшеге дейін үш қадам бар. Сондықтан <span class="math"><i>a</i><sub>4</sub></span> = 3 + (4 − 1) × 4 = 15. Қате пайым — ЖИ қателігін тексеруді үйрету үшін әдейі құрастырылған мысал, нақты сыртқы ЖИ жауабы ретінде ұсынылмайды.</p></details></div></section>`;plot()}
function plot(){const a=+document.getElementById('a1').value,d=+document.getElementById('d').value,n=+document.getElementById('n').value;document.getElementById('a1v').textContent=a;document.getElementById('dv').textContent=d;document.getElementById('nv').textContent=n;document.getElementById('labFormula').innerHTML=`<span class="math"><i>a</i><sub>${n}</sub></span> = ${a} + (${n} − 1) × (${d}) = ${a+(n-1)*d}. Қадам саны: ${n-1}.`;const vals=Array.from({length:10},(_,i)=>a+i*d),lo=Math.min(...vals)-2,hi=Math.max(...vals)+2;const y=v=>205-(v-lo)/(hi-lo)*170;let svg='<path d="M40 15V210H460" stroke="#78968b" fill="none"/>';for(let k=0;k<5;k++){const v=lo+(hi-lo)*k/4;svg+=`<line x1="40" y1="${y(v)}" x2="460" y2="${y(v)}" stroke="#d8e3df"/><text x="4" y="${y(v)+4}" font-size="11" fill="#526b6a">${Math.round(v)}</text>`}vals.forEach((v,i)=>{let x=58+i*42;svg+=`<circle cx="${x}" cy="${y(v)}" r="${i===n-1?7:4}" fill="${i===n-1?'#a45e16':'#0c6557'}"/><text x="${x-3}" y="228" font-size="11" fill="#526b6a">${i+1}</text>`});document.getElementById('plot').innerHTML=svg;document.getElementById('sequenceText').textContent=vals.join('; ')}
function reportRows(){return Object.keys(SKILLS).map(skill=>{const a=saved.records.filter(r=>r.skill===skill&&r.phase==='diagnostic'),b=saved.records.filter(r=>r.skill===skill&&r.phase==='exit');return{skill,label:SKILLS[skill],before:a.filter(r=>r.firstCorrect).length,beforeTotal:a.length,after:b.filter(r=>r.firstCorrect).length,afterTotal:b.length,hints:saved.records.filter(r=>r.skill===skill).reduce((v,r)=>v+r.hints,0)}})}
function makePrompt(){return `Сен 9-сынып алгебра мұғалімінің көмекшісісің. Тақырып: арифметикалық прогрессия. Төмендегі анонимді нәтижелерді талда. Нәтижелер бір құрылғыдағы оқу сессияларынан, сыныптық зерттеу емес. Әр дағдыда дұрыс/орындалған тапсырма саны берілген, бастапқы және қорытынды тапсырмалар саны әртүрлі болуы мүмкін, тікелей пайыздық өсім есептеме. Бір жауаптан оқушының нақты қате себебін кесіп айтпа. 1) Ықтимал қиындықты және оны тексеретін сұрақты жаз. 2) Әр қиындыққа жеңіл және қолданбалы екі жаңа тапсырма бер. 3) Әр тапсырманың шешімін тәуелсіз есептеп, жауабын көрсет. 4) Дайын жауапты бірден ашпайтын үш көмек қадамын ұсын. 5) Мұғалім тексеруге тиіс тұстарды белгіле. Жеке дерек қоспа. Формулалар: d=a₂−a₁; aₙ=a₁+(n−1)d; n=(aₙ−a₁)/d+1, соңғы формула тек d≠0 кезінде. n оң бүтін сан болуы керек. Деректер:\n${JSON.stringify(reportRows(),null,2)}`}
function teacher(){const rows=reportRows();app.innerHTML=`<section class="wrap section"><div class="section-visual"><div><span class="eyebrow">Мұғалім жұмыс үстелі</span><h1 style="font-size:44px">Дерекке сүйенген<br>келесі қадам</h1><p>Оқушы нәтижесін талдап, ЖИ ұсынысын тексеріңіз. Соңғы шешім — мұғалімде.</p></div><img src="assets/illustration-3.webp" alt="Мұғалімнің тексеруін білдіретін дәптер мен үлкейткіш иллюстрациясы"></div><div class="notice"><b>Сессияның нақты деректері.</b> Кесте осы құрылғыда орындалған тапсырмалардан құралады. Алдын ала толтырылған оқушы нәтижелері жоқ. Қайта орындалған қорытынды тапсырмалар да саналады, сондықтан бұл кесте сыныптық эксперимент емес.</div><div class="card table-scroll"><table><thead><tr><th>Дағды</th><th>Бастапқы: көмексіз / орындалған</th><th>Қайта тексеру: көмексіз / орындалған</th><th>Ашылған көмек</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${r.before} / ${r.beforeTotal}</td><td>${r.after} / ${r.afterTotal}</td><td>${r.hints}</td></tr>`).join('')}</tbody></table><div class="actions"><button onclick="downloadResults('json')">JSON жүктеу</button><button class="secondary" onclick="downloadResults('csv')">CSV жүктеу</button><button class="secondary" onclick="window.print()">Басып шығару</button><button class="link" onclick="clearResults()">Деректерді тазарту</button></div></div><div class="split" style="margin-top:24px"><article class="card"><h3>ЖИ-ге арналған анонимді сұрау</h3><ol class="step-list"><li>Оқушы нәтижесін тексеріңіз.</li><li>Дайын сұрауды көшіріп, өзіңіз қолданатын ChatGPT-ге енгізіңіз.</li><li>Ұсынылған есептерді өзіңіз шығарып, тілін және деңгейін тексеріңіз.</li><li>Сәйкес тапсырманы оқушыға беріңіз.</li></ol><label for="prompt">Сұрау мәтіні</label><textarea id="prompt" readonly>${esc(makePrompt())}</textarea><button style="margin-top:12px" onclick="copyPrompt()">Сұрауды көшіру</button></article><article class="card"><h3>Мұғалімнің тексеру жазбасы</h3><p>ЖИ не ұсынды? Қай есепті, түсіндірмені немесе деңгейді өзгерттіңіз? Соңғы шешімді кім қабылдады?</p><label for="review">Өз тексеруіңіз бен түзетуіңіз</label><textarea id="review" placeholder="Мысалы: ЖИ n = 6,5 нәтижесін мүше нөмірі деп қабылдады. n оң бүтін сан болуы керек екенін тексеріп, тапсырманы түзеттім.">${esc(saved.review||'')}</textarea><button style="margin-top:12px" onclick="saved.review=document.getElementById('review').value;persist();toast('Тексеру жазбасы сақталды')">Жазбаны сақтау</button><p class="small">Мысал — тек жазу үлгісі. Оны өз жұмысыңызда болмаған оқиға ретінде көшірмеңіз.</p></article></div><div class="card" style="margin-top:24px"><h3>Сабақтағы қолдану сценарийі</h3><p>5 минут түсіндіру; 8 минут диагностика; 12 минут жеке жаттығу; 7 минут модель және ЖИ қатесін тексеру; 8 минут қайта тексеру мен өмірлік есеп; 5 минут қорытынды. Бұл — ұсынылған 45 минуттық жоспар, сабақта апробацияланбаған.</p><details><summary>Жеке жаттығуды қолмен таңдау</summary><div class="actions">${Object.entries(SKILLS).map(([k,v])=>`<button class="secondary" onclick="start('practice','${k}')">${v}</button>`).join('')}</div></details><details><summary>Мақсат, авторлық үлес және шектеулер</summary><p><b>Жұмыс мақсаты:</b> айырманың таңбасын, n−1 қадам санын және мүше мен нөмірдің айырмасын түсіндіріп, ұқсас есепті көмексіз орындау. Ресми оқу мақсатының коды мұғалімнің КТЖ-сынан енгізіледі.</p><p>ЖИ көмекшісі: OpenAI ChatGPT. Қолданылуы: мазмұн, код және түсіндірме нобайларын әзірлеу. Материал автоматты арифметикалық тексеруден өтті. Мұғалім сабаққа дейін әдістемелік бейімдеу мен соңғы тексеруді жасайды. Сайттағы кері байланыс пен бағыт ұсыну — алдын ала жазылған ережелер. Тірі ЖИ API қосылмаған. Оқушы жауабының нақты себебін мұғалім әңгімелесу арқылы тексереді.</p><p>Дербес дерек жиналмайды. Жергілікті сақтау бір құрылғыға ортақ. Келесі оқушыға берерде деректерді тазарту немесе нәтижені экспорттау қажет. Ресурс үйренуге арналған, қорғалған емтихан жүйесі емес.</p></details><details><summary>Әдістемелік дереккөздер</summary><p><a href="https://www.unesco.org/en/articles/ai-competency-framework-teachers?hub=365" target="_blank" rel="noopener">UNESCO: AI competency framework for teachers, 2024</a><br><a href="https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback" target="_blank" rel="noopener">EEF: Teacher Feedback to Improve Pupil Learning, 2021</a></p><p>Байқау талаптары: пайдаланушы ұсынған «Цифрлық мұғалім» облыстық сырттай байқауының ережесі, 2026.</p></details></div></section>`}
async function copyPrompt(){try{await navigator.clipboard.writeText(makePrompt());toast('Сұрау көшірілді')}catch{document.getElementById('prompt').select();toast('Мәтін белгіленді. Ctrl+C арқылы көшіріңіз.')}}
function downloadResults(type){let text,mime;if(type==='json'){text=JSON.stringify({project:'QADAM',version:'1.0',dataType:'local_learning_sessions',exportedAt:new Date().toISOString(),summary:reportRows(),records:saved.records,teacherReview:saved.review},null,2);mime='application/json'}else{text='\uFEFFДағды,Бастапқы дұрыс,Бастапқы орындалған,Қайта дұрыс,Қайта орындалған,Көмек\r\n'+reportRows().map(r=>[r.label,r.before,r.beforeTotal,r.after,r.afterTotal,r.hints].join(',')).join('\r\n');mime='text/csv;charset=utf-8'}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download='QADAM_natizhe.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearResults(){if(!confirm('Осы құрылғыдағы барлық нәтиже мен тексеру жазбасын өшіресіз бе?'))return;saved={records:[],review:''};persist();teacher();toast('Деректер тазартылды')}
window.QADAM_TEST={parseNumeric,checkAnswer,recommended,reportRows};show('home');
